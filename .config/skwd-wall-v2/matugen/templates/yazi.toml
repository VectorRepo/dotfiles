[app]
overall = { bg = "{{colors.surface.default.hex}}" }

[mgr]
cwd = { fg = "{{colors.primary.default.hex}}" }

find_keyword  = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
find_position = { fg = "{{colors.tertiary.default.hex}}", italic = true }

symlink_target = { fg = "{{colors.on_surface_variant.default.hex}}", italic = true }

marker_copied   = { fg = "{{colors.secondary.default.hex}}" }
marker_cut      = { fg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.tertiary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}" }

count_copied   = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
count_cut      = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.error.default.hex}}" }
count_selected = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}" }

border_symbol = "│"
border_style  = { fg = "{{colors.outline_variant.default.hex}}" }

[indicator]
parent  = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
current = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
preview = { fg = "{{colors.tertiary.default.hex}}", underline = true }
padding = { open = "", close = "" }

[tabs]
active   = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

select_main = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

unset_main = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
unset_alt  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[status]
overall = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "{{colors.tertiary.default.hex}}" }
perm_read  = { fg = "{{colors.secondary.default.hex}}" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_exec  = { fg = "{{colors.primary.default.hex}}" }
perm_sep   = { fg = "{{colors.on_surface_variant.default.hex}}" }

progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[which]
border = { fg = "{{colors.outline_variant.default.hex}}" }
cols = 3
mask = { bg = "{{colors.surface.default.hex}}" }
cand = { fg = "{{colors.tertiary.default.hex}}" }
rest = { fg = "{{colors.on_surface_variant.default.hex}}" }
desc = { fg = "{{colors.primary.default.hex}}" }
separator = " -> "
separator_style = { fg = "{{colors.outline_variant.default.hex}}" }

[confirm]
border = { fg = "{{colors.primary.default.hex}}" }
title  = { fg = "{{colors.primary.default.hex}}", bold = true }
body   = { fg = "{{colors.on_surface.default.hex}}" }
list   = { fg = "{{colors.on_surface_variant.default.hex}}" }
btn_yes = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}" }
btn_no  = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.error.default.hex}}" }
btn_labels = ["  Yes  ", "  No  "]

[spot]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}", bold = true }
tbl_col  = { fg = "{{colors.tertiary.default.hex}}" }
tbl_cell = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.primary.default.hex}}" }
title_warn  = { fg = "{{colors.secondary.default.hex}}" }
title_error = { fg = "{{colors.error.default.hex}}" }

[pick]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.on_surface.default.hex}}" }
value    = { fg = "{{colors.on_surface.default.hex}}" }
selected = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[cmp]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}" }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}" }
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}", bold = true }
hovered = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}" }

[help]
border  = { fg = "{{colors.primary.default.hex}}" }
chord   = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
action  = { fg = "{{colors.on_surface.default.hex}}" }
hovered = { fg = "{{colors.surface.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "{{colors.secondary.default.hex}}" },

	# Video and audio
	{ mime = "{audio,video}/*", fg = "{{colors.tertiary.default.hex}}" },

	# Archives
	{ mime = "application/{zip,rar,7z-compressed,tar,gzip,bzip,x-tar,x-bzip2}", fg = "{{colors.error_container.default.hex}}" },

	# Empty file
	{ mime = "inode/empty", fg = "{{colors.on_surface_variant.default.hex}}" },

	# Orphan symbolic links
	{ url = "*", is = "orphan", fg = "{{colors.error.default.hex}}" },

	# Executables
	{ url = "*", is = "exec", fg = "{{colors.primary.default.hex}}", bold = true },

	# Fallback for regular files
	{ url = "*", fg = "{{colors.on_surface.default.hex}}" },

	# Directories
	{ url = "*/", fg = "{{colors.primary.default.hex}}", bold = true },
]
