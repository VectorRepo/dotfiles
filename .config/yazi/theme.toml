[confirm]
border = { fg = "#ffb693" }
title  = { fg = "#ffb693", bold = true }
body   = { fg = "#f4ded5" }
list   = { fg = "#dec0b3" }
btn_yes = { fg = "#1b110c", bg = "#ffb693" }
btn_no  = { fg = "#1b110c", bg = "#ffb4ab" }
btn_labels = ["  Yes  ", "  No  "]

[spot]
border   = { fg = "#ffb693" }
title    = { fg = "#ffb693", bold = true }
tbl_col  = { fg = "#d1cb52" }
tbl_cell = { fg = "#1b110c", bg = "#ffb693" }

[notify]
title_info  = { fg = "#ffb693" }
title_warn  = { fg = "#ffb693" }
title_error = { fg = "#ffb4ab" }

[pick]
border   = { fg = "#ffb693" }
active   = { fg = "#ffb693", bold = true }
inactive = { fg = "#dec0b3" }

[input]
border   = { fg = "#ffb693" }
title    = { fg = "#f4ded5" }
value    = { fg = "#f4ded5" }
selected = { fg = "#1b110c", bg = "#ffb693" }

[cmp]
border   = { fg = "#ffb693" }
active   = { fg = "#1b110c", bg = "#ffb693" }
inactive = { fg = "#dec0b3" }
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#ffb693" }
title   = { fg = "#ffb693", bold = true }
hovered = { fg = "#1b110c", bg = "#ffb693" }

[help]
border  = { fg = "#ffb693" }
chord   = { fg = "#1b110c", bg = "#d1cb52" }
action  = { fg = "#f4ded5" }
hovered = { fg = "#1b110c", bg = "#ffb693", bold = true }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#ffb693" },

	# Video and audio
	{ mime = "{audio,video}/*", fg = "#d1cb52" },

	# Archives
	{ mime = "application/{zip,rar,7z-compressed,tar,gzip,bzip,x-tar,x-bzip2}", fg = "#93000a" },

	# Empty file
	{ mime = "inode/empty", fg = "#dec0b3" },

	# Orphan symbolic links
	{ url = "*", is = "orphan", fg = "#ffb4ab" },

	# Executables
	{ url = "*", is = "exec", fg = "#ffb693", bold = true },

	# Fallback for regular files
	{ url = "*", fg = "#f4ded5" },

	# Directories
	{ url = "*/", fg = "#ffb693", bold = true },
]
