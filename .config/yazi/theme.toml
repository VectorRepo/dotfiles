sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_type  = { fg = "#d1cb52" }
perm_read  = { fg = "#ffb693" }
perm_write = { fg = "#ffb4ab" }
perm_exec  = { fg = "#ffb693" }
perm_sep   = { fg = "#dec0b3" }

